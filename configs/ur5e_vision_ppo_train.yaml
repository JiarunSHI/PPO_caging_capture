extends: ur5e_vision.yaml

# This seed is intentionally disjoint from the Cage-supervision seed (42)
# and from the held-out PPO evaluation seed.  The trajectory geometry and
# quality limits are inherited unchanged from ur5e_vision.yaml.
system:
  seed: 20260824

vision:
  # The red-color detector consumes RGB plus depth.  Segmentation is a third
  # render used only for audit truth, so omit it during PPO interaction.
  render_segmentation_for_audit: false

ppo:
  # 409,600 accepted policy transitions: enough for roughly one pass over the
  # 5,000-track bank without the 1,024,000-step cost of the full preset.
  rollout_steps: 1024
  updates: 400
  # Eight is only an upper bound: the measured KL guard may stop an update
  # earlier when the current policy moves too far from the rollout policy.
  update_epochs: 8
  minibatch_size: 256
