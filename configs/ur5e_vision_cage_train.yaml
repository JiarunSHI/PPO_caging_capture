extends: ur5e_vision_cage_data.yaml

# Quality-oriented local-training preset.  RGB-D has already been reduced to
# 20-D causal features, so 300 MLP epochs are still inexpensive.  Early
# stopping and learning-rate decay prevent blindly running all 300 epochs.
cage_network:
  batch_size: 256
  epochs: 300
  # Position is measured in squared metres while orientation is measured in
  # squared radians.  This scale factor prevents orientation from overwhelming
  # a 25--100 mm Cartesian error.
  position_loss_weight: 50.0
  orientation_loss_weight: 0.4
  # Absolute distance/angle terms retain useful gradients in the fine-error
  # region where pure squared losses become very small.  At the success
  # boundary their position and orientation contributions are approximately
  # balanced; the original squared losses remain active for larger errors.
  position_absolute_loss_weight: 0.25
  orientation_absolute_loss_weight: 0.025
  # A Cage prediction is successful only when both components satisfy these
  # fine-tracking tolerances. These affect validation metrics, while all four
  # continuous loss terms above provide the training gradient.
  validation_position_threshold_m: 0.003
  validation_orientation_threshold_deg: 2.0
