extends: ur5e_jailer_curriculum.yaml

jailer:
  checkpoint_interval_updates: 1
  target_sampling_max_attempts: 300
  initial_pose_pool:
    minimum_pairwise_joint_distance_rad: 0.05
    maximum_attempts: 10000
  curriculum:
    promotion_window_updates: 1
    stop_when_final_stage_mastered: false
    stages:
      - name: position_smoke
        task: position
        reward_orientation_quality_weight: 0.05
        action_velocity_scale: 1.00
        rollout_steps_per_slot: 5
        position_error_range_m: [0.005, 0.08]
        orientation_error_range_deg: [0.0, 180.0]
        target_joint_offset_max_rad: [0.25, 0.25, 0.25, 0.20, 0.20, 0.20]
        minimum_updates: 1
        success_position_m: 0.010
        success_orientation_deg: 180.0
        success_tcp_speed_mps: 0.030
        success_tcp_angular_speed_radps: 10.0
        promotion_position_mean_m: 1.0
        promotion_orientation_mean_deg: 180.0
        promotion_success_rate: 0.0
      - name: pose_smoke
        task: pose
        reward_orientation_quality_weight: 0.30
        action_velocity_scale: 0.10
        rollout_steps_per_slot: 5
        position_error_range_m: [0.005, 0.08]
        orientation_error_range_deg: [1.0, 15.0]
        target_joint_offset_max_rad: [0.25, 0.25, 0.25, 0.20, 0.20, 0.20]
        minimum_updates: 1
        success_position_m: 0.010
        success_orientation_deg: 5.0
        success_tcp_speed_mps: 0.030
        success_tcp_angular_speed_radps: 0.15
        promotion_position_mean_m: 1.0
        promotion_orientation_mean_deg: 180.0
        promotion_success_rate: 0.0
  ppo:
    updates: 1
    update_epochs: 1
    minibatch_size: 64
