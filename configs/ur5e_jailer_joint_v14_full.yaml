extends: ur5e_jailer_curriculum.yaml

# V14 is one from-scratch, three-phase run.  Ten small-span position stages
# are expanded by the loader into masked and observed passes, then the same
# Actor learns ten joint position-orientation stages with independent PPO
# Actor/Critic optimization.
jailer:
  logical_slots: 50
  checkpoint_interval_updates: 500
  rollout_boundary_mode: single_task_per_slot_until_terminal_v1

  # Keep the per-step quality term non-positive, at one tenth of the legacy
  # scale so terminal success/failure and signed progress remain distinctive.
  reward_step_quality_baseline: 1.0
  reward_step_quality_cost_scale: 0.1
  # Keep terminal events on the same scale.  Early failure still receives the
  # discounted remaining-step compensation below, so a huge fixed -100 is no
  # longer needed to prevent deliberate early termination.
  success_bonus: 10.0
  collision_penalty: 10.0
  termination_semantics_mode: time_limit_bootstrap_failure_compensation_v1

  reward_position_progress_weight: 2.0
  reward_orientation_progress_weight: 4.0
  reward_position_quality_mode: stage_normalized_fine_exp_coarse_inverse_quadratic_v2
  reward_position_fine_quality_weight: 0.70
  reward_position_progress_mode: normalized_error_reduction_v1
  reward_position_progress_reference_m: 0.005
  reward_component_progress_after_success_mode: no_positive_after_component_success_v2
  reward_weight_mode: dynamic_normalized_pose_error_achieved_floor_v2
  dynamic_reward_min_weight: 0.25
  dynamic_reward_urgency_power: 1.0
  joint_reward_progress_global: true

  curriculum:
    pose_only_actor_warm_start: false
    three_phase_full_training: true
    promotion_window_updates: 10
    stop_when_final_stage_mastered: true
    stages:
      - name: position_p01_006_020mm
        task: position
        reward_orientation_quality_weight: 0.0
        joint_log_std_entry_min: -2.5
        joint_log_std_floor: -3.2
        action_velocity_scale: 0.35
        rollout_steps_per_slot: 80
        position_error_range_m: [0.006, 0.020]
        orientation_error_range_deg: [0.0, 180.0]
        target_joint_offset_max_rad: [0.05, 0.05, 0.05, 0.05, 0.05, 0.05]
        minimum_updates: 100
        success_position_m: 0.0015
        success_orientation_deg: 180.0
        success_tcp_speed_mps: 0.080
        success_tcp_angular_speed_radps: 10.0
        promotion_position_mean_m: 0.0023
        promotion_orientation_mean_deg: 180.0
        promotion_success_rate: 0.75
        promotion_success_rate_strict: false
        entry_critic_alignment_mode: pre_update_ev_gate_v1
        entry_critic_alignment_ev_threshold: 0.30
        entry_critic_alignment_consecutive_rollouts: 3
