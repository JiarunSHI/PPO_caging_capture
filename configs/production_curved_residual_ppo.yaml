extends: production_curved_ppo.yaml

# Must differ from the 20260831 archive used by the final DAgger Actor.
system:
  seed: 20260911

trajectory:
  count: 500

ppo:
  # V2 keeps useful reward resolution across the observed base-policy error
  # range instead of collapsing most transitions near -1.
  reward_mode: normalized_cage_tracking_v2
  reward_position_reference_m: 0.060
  reward_orientation_reference_deg: 35.0
  reward_position_quality_weight: 0.65
  reward_orientation_quality_weight: 0.35
  reward_progress_weight: 1.00

residual_training:
  enabled: true
  action_scale: 0.20
  initial_log_std: -1.8
  actor_learning_rate: 0.00003
  critic_learning_rate: 0.0003
  actor_update_epochs: 4
  critic_update_epochs: 10
  critic_alignment_steps: 8192
  critic_alignment_epochs: 20
  critic_alignment_batch_size: 256
  checkpoint_interval_updates: 50
  validation_interval_updates: 50
  validation_episodes: 20
