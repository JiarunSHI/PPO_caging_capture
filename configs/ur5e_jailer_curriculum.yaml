  ppo:
    state_dim: 18
    action_dim: 6
    hidden_dims: [128, 128]
    pose_residual_hidden_dims: [64, 64]
    gamma: 0.99
    gae_lambda: 0.95
    clip_epsilon: 0.2
    value_coefficient: 0.5
    entropy_coefficient: 0.002
    # Fine-control continuation uses smaller PPO updates; the longer 4,000
    # update schedule replaces the former need for aggressive 3e-4 steps.
    learning_rate: 0.0001
    pose_residual_learning_rate: 0.0005
    max_grad_norm: 0.5
    state_normalization_clip: 10.0
    state_normalization_epsilon: 1.0e-8
    target_kl: 0.02
    kl_stop_multiplier: 1.5
    action_saturation_threshold: 0.98
    updates: 4000
    update_epochs: 10
    minibatch_size: 1024

constrained_differential_ik:
  control_rate_hz: 100.0
  position_only: false
  position_gain_s_inv: 5.0
  orientation_gain_s_inv: 4.0
  maximum_tcp_linear_speed_mps: 0.60
  maximum_tcp_angular_speed_radps: 2.0
  position_task_weight: 1.0
  orientation_task_weight: 0.25
  regularization: 0.001
  joint_velocity_limit_fraction: 0.70
  joint_position_margin_rad: 0.08
  joint_acceleration_limit_radps2: [12.0, 12.0, 12.0, 20.0, 20.0, 20.0]
  qp_max_iterations: 100
  settling_time_s: 0.50
  success_position_m: 0.005
  success_orientation_deg: 3.0
  success_tcp_speed_mps: 0.020
  success_tcp_angular_speed_radps: 0.10
