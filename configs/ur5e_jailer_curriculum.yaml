extends: default.yaml

# Independent JAiLeR-style controller branch.  It does not consume Cage
# trajectories or eye-on-hand images during the static reaching curriculum.
vision:
  enabled: false

jailer:
  seed: 20260901
  control_rate_hz: 100.0
  logical_slots: 40
  # Rollout length is stage-local.  Each stage declares its own number of
  # 100 Hz control steps per logical slot; batch size is steps x 40 slots.
  action_joint_velocity_limit_fraction: 0.50
  joint_position_margin_rad: 0.08
  joint_acceleration_limit_radps2: [12.0, 12.0, 12.0, 20.0, 20.0, 20.0]
  target_sampling_max_attempts: 2000
  target_sampling_pool_retries: 12
  checkpoint_interval_updates: 50
  success_curve_interval_updates: 100
  success_curve_position_bin_width_m: 0.005
  success_curve_orientation_bin_width_deg: 2.0
  best_orientation_radian_weight: 0.10
  # Legacy position-only checkpoints saw exactly zero in state[3:6].  When
  # importing such an Actor, use this fixed physical scale and zero only the
  # previously untrained first-layer orientation columns.
  legacy_orientation_input_std_deg: 10.0
  # At the P6 -> first pose bridge boundary restore enough exploration to
  # learn the newly important orientation response.  The bridge's small
  # physical velocity scale keeps this exploration safe.
  pose_transition_min_log_std: -1.20

  # JAiLeR position reward plus the paper's suggested three TCP-axis marker
  # geometry for the later pose extension.  Joint acceleration is an effort
  # regularizer, not a replacement for TCP error.
  # Shift pose quality into a non-positive per-step cost and add a terminal
  # success bonus.  This makes reaching sooner preferable to loitering just
  # outside the threshold after early task termination is enabled.
  reward_position_error_gain: 400.0
  orientation_marker_lever_m: 0.05
  reward_orientation_marker_gain: 40000.0
  reward_orientation_progress_weight: 2.0
  reward_orientation_progress_reference_deg: 10.0
  # Dense near-goal shaping for pose refinement.  It rewards reduction of
  # position error and penalizes moving away, with a smooth gate that fades to
  # zero outside the local pose-control neighborhood.
  reward_position_progress_weight: 1.0
  reward_position_progress_reference_m: 0.005
  reward_near_target_position_m: 0.030
  reward_near_target_orientation_deg: 15.0
  reward_position_quality_weight: 0.60
  reward_step_quality_baseline: 1.0
  reward_joint_acceleration_weight: 0.001
  success_bonus: 1.0
  collision_penalty: 2.0

  initial_pose_pool:
    joint_offset_max_rad: [2.0, 1.2, 1.2, 1.6, 1.6, 2.0]
    joint_limit_margin_rad: 0.12
    minimum_pairwise_joint_distance_rad: 0.35
    maximum_attempts: 30000

  curriculum:
    promotion_window_updates: 10
    # Continue optimizing the final fine-control stage until all configured
    # updates are consumed; mastering it no longer stops training early.
    stop_when_final_stage_mastered: false
    stages:
      - name: position_p01_006_020mm
        task: position
        reward_orientation_quality_weight: 0.0
        action_velocity_scale: 1.00
        rollout_steps_per_slot: 60
        position_error_range_m: [0.006, 0.020]
        orientation_error_range_deg: [0.0, 180.0]
        target_joint_offset_max_rad: [0.04, 0.04, 0.04, 0.03, 0.03, 0.03]
        minimum_updates: 100
        success_position_m: 0.0015
        success_orientation_deg: 180.0
        success_tcp_speed_mps: 0.080
        success_tcp_angular_speed_radps: 10.0
        promotion_position_mean_m: 0.0025
        promotion_orientation_mean_deg: 180.0
        promotion_success_rate: 0.80
      - name: position_p02_006_035mm
        task: position
        reward_orientation_quality_weight: 0.0
        action_velocity_scale: 1.00
        rollout_steps_per_slot: 60
        position_error_range_m: [0.006, 0.035]
        orientation_error_range_deg: [0.0, 180.0]
        target_joint_offset_max_rad: [0.07, 0.07, 0.07, 0.05, 0.05, 0.05]
        minimum_updates: 100
        success_position_m: 0.002
        success_orientation_deg: 180.0
        success_tcp_speed_mps: 0.080
        success_tcp_angular_speed_radps: 10.0
        promotion_position_mean_m: 0.003
        promotion_orientation_mean_deg: 180.0
        promotion_success_rate: 0.80
      - name: position_p03_006_055mm
