extends: ur5e_jailer_joint_v11.yaml

# V12 is a genuine joint position-orientation PPO policy.  The Observed-P6
# Actor is copied once by --actor-warm-start-checkpoint; there is no frozen
# reference Actor, action-imitation loss, or position rehearsal objective.
jailer:
  # latest.pt is still atomically overwritten after every update and every
  # promoted stage keeps its own checkpoint.  Sparse numbered snapshots avoid
  # exhausting the currently limited local disk during a stuck long stage.
  checkpoint_interval_updates: 500
  reward_position_quality_mode: stage_normalized_fine_exp_coarse_inverse_quadratic_v2
  reward_position_fine_quality_weight: 0.70
  reward_position_progress_mode: position_quality_delta_v2
  reward_position_progress_quality_reference: 0.10
  reward_component_progress_after_success_mode: no_positive_after_component_success_v2
  reward_weight_mode: dynamic_normalized_pose_error_achieved_floor_v2

  ppo:
    action_composition_mode: joint_pose_actor_dynamic_speed_ppo_only_v2
    # Actor and Critic have independent minibatch loops and independent Adam
    # states.  These may be tuned separately in later experiments.
    actor_update_epochs: 10
    critic_update_epochs: 10
    # Entropy annealing is local to each curriculum stage.  With
    # p=min(actor PPO updates in this stage / minimum_updates, 1), the
    # effective coefficient is start + p * (end - start).  Critic-only
    # alignment rollouts do not advance p, and the end value is held after
    # minimum_updates until promotion.
    entropy_schedule:
      mode: linear_within_stage_minimum_updates_v1
      stages:
        joint_bridge_b01_006_025mm_05deg: {start: 0.0030, end: 0.0025}
        joint_bridge_b02_006_025mm_045deg: {start: 0.0025, end: 0.0020}
        joint_bridge_b03_006_025mm_04deg: {start: 0.0020, end: 0.0015}
        joint_bridge_b04_006_025mm_032deg: {start: 0.0015, end: 0.0010}
        joint_bridge_b05_006_025mm_025deg: {start: 0.0010, end: 0.0007}
        joint_bridge_b06_006_025mm_018deg: {start: 0.0007, end: 0.0005}
        joint_pose_o01_006_025mm_01_05deg: {start: 0.0005, end: 0.0003}
        joint_pose_o02_006_040mm_01_10deg: {start: 0.0010, end: 0.0007}
        joint_pose_o03_006_060mm_01_16deg: {start: 0.0015, end: 0.0010}
        joint_pose_o04_006_090mm_01_24deg: {start: 0.0020, end: 0.0012}
        joint_pose_o05_006_120mm_01_35deg: {start: 0.0025, end: 0.0015}
        joint_pose_o06_006_150mm_01_45deg: {start: 0.0030, end: 0.0018}
