extends: ur5e_jailer_curriculum.yaml

# V11 starts directly from the proven full-observation P6 Actor.  One joint
# Actor then learns position and orientation together; the frozen P6 copy is
# used only as a state-dependent training reference, never as a second action.
jailer:
  reward_weight_mode: dynamic_normalized_pose_error_v1
  dynamic_reward_min_weight: 0.15
  dynamic_reward_urgency_power: 1.0
  joint_reward_progress_global: true
  rollout_boundary_mode: stop_spawn_then_drain_active_tasks_v1

  curriculum:
    pose_only_actor_warm_start: true
    promotion_window_updates: 10
    stop_when_final_stage_mastered: true
    stages:
      - name: joint_bridge_b01_006_025mm_05deg
        task: pose
        curriculum_phase: joint_pose_bridge
        orientation_observation_mode: observed
        entry_transition: continuous
        entry_critic_alignment_updates: 8
        reward_orientation_quality_weight: 0.50
        position_reference_loss_weight: 0.10
        joint_log_std_entry_min: -1.8
        joint_log_std_floor: -2.5
        action_velocity_scale: 0.40
        rollout_steps_per_slot: 80
        position_error_range_m: [0.006, 0.025]
        orientation_error_range_deg: [1.0, 5.0]
        target_joint_offset_max_rad: [0.05, 0.05, 0.05, 0.05, 0.05, 0.05]
        minimum_updates: 100
        success_position_m: 0.0050
        success_orientation_deg: 5.0
        success_tcp_speed_mps: 0.080
        success_tcp_angular_speed_radps: 0.30
        promotion_position_mean_m: 0.0055
        promotion_orientation_mean_deg: 4.5
        promotion_success_rate: 0.80
        promotion_success_rate_strict: true
      - name: joint_bridge_b02_006_025mm_045deg
