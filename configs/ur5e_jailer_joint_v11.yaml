  ppo:
    action_composition_mode: joint_pose_actor_dynamic_speed_with_position_reference_v1
    joint_actor_learning_rate: 0.00002
    joint_critic_learning_rate: 0.00010
    position_reference_gate_error_ratio: [0.75, 2.0]
    # Disabled for the first joint-policy experiment: every PPO sample keeps
    # its real position and orientation error.  This avoids an unverified
    # position-only imitation bias in the shared Actor.
    position_rehearsal_fraction: 0.0
    position_rehearsal_loss_weight: 0.0
    joint_action_gain_error_ratio: [0.0, 0.5, 1.0, 2.0, 4.0, 6.0]
    joint_action_gain_values: [0.10, 0.10, 0.20, 0.40, 0.70, 1.00]
    entropy_coefficient: 0.003
    updates: 1000000
    update_epochs: 10
    minibatch_size: 1024
