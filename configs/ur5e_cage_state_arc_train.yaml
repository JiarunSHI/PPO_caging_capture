extends: ur5e_cage_state_arc_data.yaml

# The network predicts one continuous coordinate on the actual minor arc.
# Candidate spacing is therefore irrelevant to the learned target.
cage_network:
  training_contract: state_arc_continuous_cage_mlp_v1
  hidden_dims: [128, 128, 64]
  batch_size: 512
  epochs: 300
  learning_rate: 0.0003
  minimum_learning_rate: 0.000001
  weight_decay: 0.00001
  validation_fraction: 0.15
  early_stopping_patience: 35
  early_stopping_min_delta: 0.00001
  lr_plateau_patience: 10
  lr_decay_factor: 0.5

  # Huber(alpha error), plus the same error expressed as endpoint chord
  # distance and in-plane Cage orientation error.
  arc_huber_beta: 0.05
  position_error_scale_m: 0.003
  orientation_error_scale_deg: 2.0
  arc_loss_weight: 1.0
  position_loss_weight: 0.5
  orientation_loss_weight: 0.5

  # These affect validation reporting and early model interpretation, not the
  # sigmoid output range.
  validation_position_threshold_m: 0.003
  validation_orientation_threshold_deg: 2.0
